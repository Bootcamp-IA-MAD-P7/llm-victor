[project]
name = "ai-content-studio-api"
version = "0.1.0"
description = "API de AI Content Studio"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
